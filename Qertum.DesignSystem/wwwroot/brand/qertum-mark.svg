<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#F5F7F5">
  <!-- The qertum.com header mark: two dashed rings and a tail, paper on the ink page. -->
  <defs>
    <mask id="mark-mask">
      <rect width="120" height="120" fill="white"/>
      <rect x="84" y="84" width="12" height="12" fill="black" transform="rotate(45 90 90)"/>
    </mask>
  </defs>
  <g mask="url(#mark-mask)">
    <circle cx="60" cy="60" r="41" stroke-width="6" pathLength="120" stroke-dasharray="5 5"/>
    <circle cx="60" cy="60" r="29" stroke-width="6" pathLength="120" stroke-dasharray="5 5" stroke-dashoffset="5"/>
  </g>
  <line x1="82" y1="82" x2="98" y2="98" stroke-width="6" stroke-linecap="butt"/>
</svg>

# Single-container Qertum deployment for Unraid (browser/API HTTP bound to loopback).
#
#   docker compose -f deploy/single-container/docker-compose.yml pull
#   docker compose -f deploy/single-container/docker-compose.yml up -d
#
# Redeploy after a new CI push: re-run the two commands above.
#
# Required environment (shell or a .env file beside this compose file):
#   QERTUM_REGISTRY  registry address the CI job pushes to, no scheme (e.g. registry.example.lan:5000)
# Optional: QERTUM_HOST defaults to localhost for a local trial; remote use needs a TLS proxy.
#   QERTUM_HOST      public IP/name that browsers and ACME clients type to reach this stack, exactly
#                    (no NAT, DNS alias or other name in between; sign-in accepts only this address)
#
# NOTE: with direct port exposure the published host port MUST equal the
# container port, because the OIDC authority and ACME base URL are advertised
# to browsers/clients using these port numbers. If you remap a host port,
# change the matching *_PORT env var to the same value.
#
# Rollback: CI pushes both ':latest' and ':<git-sha>'. To pin/roll back, set
# QERTUM_IMAGE_TAG to a specific sha before pulling, e.g.:
#   QERTUM_IMAGE_TAG=abcdef0 docker compose -f deploy/single-container/docker-compose.yml pull
#   QERTUM_IMAGE_TAG=abcdef0 docker compose -f deploy/single-container/docker-compose.yml up -d

services:
  qertum:
    image: ${QERTUM_REGISTRY:?set QERTUM_REGISTRY to the registry address, e.g. registry.example.lan:5000}/qertum:${QERTUM_IMAGE_TAG:-latest}
    container_name: qertum
    restart: unless-stopped
    labels:
      # Unraid Docker tab link for a local browser or SSH tunnel; remote use needs a TLS proxy.
      net.unraid.docker.webui: "http://localhost:[PORT:8090]/"
    environment:
      # Local trial defaults to localhost. For a TLS proxy set its public hostname, exactly as typed
      # (no NAT, DNS alias or other name in between): sign-in accepts only this address.
      QERTUM_HOST: "${QERTUM_HOST:-localhost}"
      QERTUM_PUBLIC_SCHEME: "${QERTUM_PUBLIC_SCHEME:-http}"
      QERTUM_TRUSTED_PROXIES: "${QERTUM_TRUSTED_PROXIES:-}"
      # Advertised web port for OIDC redirect registration. The web app still LISTENS
      # on 8080 inside the container, so this MUST equal the host port mapped to 8080.
      WEB_PORT: "8090"
      # ASPNETCORE_ENVIRONMENT defaults to Production inside the image.
    ports:
      - "${QERTUM_BIND_ADDRESS:-127.0.0.1}:8090:8080"   # Web UI   (host 8090 -> container 8080)
      - "${QERTUM_BIND_ADDRESS:-127.0.0.1}:8081:8081"   # Identity (OIDC)
      - "${QERTUM_BIND_ADDRESS:-127.0.0.1}:8082:8082"   # REST API
      - "8083:8083"   # ACME
    volumes:
      # Persistent state: DB, CA keypair, Data Protection keyring, audit logs,
      # identity store. BACK THIS UP — losing it loses the CA private key.
      - /mnt/user/appdata/qertum:/data
